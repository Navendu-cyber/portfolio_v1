<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Navendu | Flutter & Embedded Systems Developer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            neon: {
              blue: '#00F0FF',
              cyan: '#00FFFF',
              amber: '#FFB700',
              green: '#00FF9D',
              purple: '#D946EF',
              dark: '#0A0A12',
            },
            dark: {
              bg: '#05050A',
              card: '#0A0A12',
              border: '#1F1F33',
            },
            light: {
              bg: '#FFFFFF', // Pure white for cleaner look
              card: '#F3F4F6', // Slight contrast for cards
              border: '#E5E7EB',
              text: '#111827' // Gray-900
            }
          },
          backgroundImage: {
            'circuit-pattern': "radial-gradient(circle, rgba(0,240,255,0.1) 1px, transparent 1px)",
          },
          animation: {
            'glass-sweep': 'glass-sweep 3s infinite linear',
          }
        },
      },
    }
  </script>
  <style>
    body {
      /* Default to dark mode styles for no-js fallback, handled by class in App */
      background-color: #F8FAFC;
      /* Light mode default */
      color: #0F172A;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .dark body {
      background-color: #05050A;
      color: #E2E8F0;
    }

    /* Custom Scanline Effect */
    .scanline {
      width: 100%;
      height: 100px;
      z-index: 10;
      background: linear-gradient(0deg, rgba(0, 0, 0, 0) 0%, rgba(0, 240, 255, 0.03) 50%, rgba(0, 0, 0, 0) 100%);
      opacity: 0.1;
      background-size: 100% 4px;
      animation: scanline 10s linear infinite;
      pointer-events: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      height: 100vh;
    }

    @keyframes scanline {
      0% {
        background-position: 0 -100vh;
      }

      100% {
        background-position: 0 100vh;
      }
    }

    @keyframes glass-sweep {
      0% {
        transform: translateX(-200%) skewX(-20deg);
      }

      20% {
        transform: translateX(200%) skewX(-20deg);
      }

      100% {
        transform: translateX(200%) skewX(-20deg);
      }
    }

    .animate-glass-sweep {
      animation: glass-sweep 4s infinite ease-in-out;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.24"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body class="bg-light-bg dark:bg-dark-bg text-light-text dark:text-gray-200 transition-colors duration-300">
  <div id="root"></div>
  <div class="scanline pointer-events-none fixed inset-0 z-50"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
